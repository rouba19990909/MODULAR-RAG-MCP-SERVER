# Modular RAG MCP Server - Configuration
# This is the main configuration file for the MCP Server.
# Edit this file to configure LLM, Embedding, VectorStore, and other services.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "openai"
  model: "gpt-4o"
  api_key: "sk-w2dC2WInmfIEhh2o0hCoo0Wq1Hd70bE6axrJFuTuVhXBf8Er"
  base_url: "https://api.openai-proxy.org/v1"  # 替换为代理商提供的端点
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "openai"
  model: "text-embedding-ada-002"
  dimensions: 1536
  api_key: "sk-w2dC2WInmfIEhh2o0hCoo0Wq1Hd70bE6axrJFuTuVhXBf8Er"
  base_url: "https://api.openai-proxy.org/v1"  # 替换为代理商提供的端点

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: true
  provider: "openai"
  model: "gpt-4o"
  api_key: "sk-w2dC2WInmfIEhh2o0hCoo0Wq1Hd70bE6axrJFuTuVhXBf8Er"
  base_url: "https://api.openai-proxy.org/v1"  # 替换为代理商提供的端点
  max_image_size: 2048

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: false
  provider: "none"
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 100
  
  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: true
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true
